<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 — clearing</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#1a0a2e; }
#bg-canvas { position:fixed; inset:0; z-index:0; }
#three-canvas { position:fixed; inset:0; z-index:1; pointer-events:none; }
#grain {
  position:fixed; inset:-50%; width:200%; height:200%;
  pointer-events:none; z-index:20; opacity:0.03;
  animation:grainShift 0.14s steps(1) infinite;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}
@keyframes grainShift {
  0%{transform:translate(0,0)} 20%{transform:translate(-3%,-4%)}
  40%{transform:translate(4%,2%)} 60%{transform:translate(-2%,5%)}
  80%{transform:translate(5%,-2%)}
}
#label {
  position:fixed; top:1.8rem; left:2rem; z-index:100;
  font-family:'Georgia',serif; font-size:0.7rem; letter-spacing:0.18em;
  color:rgba(255,194,226,0.3); text-transform:uppercase;
  opacity:0; transition:opacity 2s ease; user-select:none;
}
#label.visible{opacity:1}
#next {
  position:fixed; bottom:2rem; right:2.2rem; z-index:100;
  width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  border:none; background:none; cursor:pointer; opacity:0; transition:opacity 1.2s ease;
}
#next.visible{opacity:1}
#next svg{width:28px;height:28px;stroke:rgba(184,146,255,0.5);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s,transform .3s}
#next:hover svg{stroke:rgba(255,144,179,0.9);transform:translateX(4px)}
#mute {
  position:fixed; bottom:2rem; left:2rem; z-index:100;
  background:none; border:none; cursor:pointer; opacity:0; transition:opacity 1.2s ease; padding:4px;
}
#mute.visible{opacity:1}
#mute svg{width:20px;height:20px;stroke:rgba(184,146,255,0.4);fill:none;stroke-width:1.4;stroke-linecap:round;transition:stroke .3s}
#mute:hover svg{stroke:rgba(255,144,179,0.8)}
#loading {
  position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  background:#1a0a2e; font-family:'Georgia',serif; font-size:0.72rem; letter-spacing:0.22em;
  color:rgba(184,146,255,0.4); text-transform:uppercase; transition:opacity 1.6s ease;
}
#loading.fade{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="loading">entering</div>
<canvas id="bg-canvas"></canvas>
<canvas id="three-canvas"></canvas>
<div id="grain"></div>
<div id="label">01 — clearing</div>
<button id="mute" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path id="wave1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path id="wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </svg>
</button>
<button id="next" aria-label="Next room">
  <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<script>
let W=window.innerWidth, H=window.innerHeight;
const bgCanvas=document.getElementById('bg-canvas');
const bgCtx=bgCanvas.getContext('2d');
bgCanvas.width=W; bgCanvas.height=H;

// Three setup first so resize can reference camera/renderer
const threeCanvas=document.getElementById('three-canvas');
const renderer=new THREE.WebGLRenderer({canvas:threeCanvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.setClearColor(0,0);
const scene=new THREE.Scene();

// Camera far back, narrow FOV so trees look right-sized and distant
const camera=new THREE.PerspectiveCamera(42, W/H, 0.1, 600);
camera.position.set(0, 3, 55);
camera.lookAt(0, 8, 0);

window.addEventListener('resize',()=>{
  W=window.innerWidth; H=window.innerHeight;
  bgCanvas.width=W; bgCanvas.height=H;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});

// ── WIND ────────────────────────────────────────────────────
let windTime=0,windStrength=0,windTarget=0,windGust=0;
function tickWind(dt){
  windTime+=dt*0.35;
  if(Math.random()<0.007) windTarget=(Math.random()-0.35)*1.1;
  windStrength+=(windTarget-windStrength)*0.01;
  if(Math.random()<0.003) windGust=(Math.random()*0.6+0.2)*Math.sign(windStrength||1);
  windGust*=0.975;
}

// ── BG CANVAS ───────────────────────────────────────────────
function drawBG(t){
  bgCtx.clearRect(0,0,W,H);

  // Sky — majorelle → periwinkle → blush → cotton candy → coral
  const horizonY = H*0.52;
  const sky=bgCtx.createLinearGradient(0,0,0,horizonY);
  sky.addColorStop(0,   '#3d1fa8'); // deeper majorelle at top
  sky.addColorStop(0.28,'#6e44ff'); // majorelle-blue
  sky.addColorStop(0.55,'#b892ff'); // soft-periwinkle
  sky.addColorStop(0.78,'#ffc2e2'); // blush-pop
  sky.addColorStop(0.92,'#ff90b3'); // cotton-candy
  sky.addColorStop(1,   '#ef7a85'); // light-coral at horizon
  bgCtx.fillStyle=sky;
  bgCtx.fillRect(0,0,W,horizonY);

  // Soft horizon glow bloom
  const hg=bgCtx.createRadialGradient(W/2,horizonY,0,W/2,horizonY,W*0.6);
  hg.addColorStop(0,  'rgba(255,180,210,0.38)');
  hg.addColorStop(0.5,'rgba(255,144,179,0.12)');
  hg.addColorStop(1,  'rgba(110,68,255,0)');
  bgCtx.fillStyle=hg;
  bgCtx.fillRect(0,horizonY*0.6,W,horizonY*0.5);

  // Ground — very dark at horizon, brightens toward camera
  const grass=bgCtx.createLinearGradient(0,horizonY,0,H);
  grass.addColorStop(0,   '#100818'); // almost black-purple at horizon (matches sky base)
  grass.addColorStop(0.08,'#001a0c'); // dark
  grass.addColorStop(0.22,'#004b23'); // dark-spruce
  grass.addColorStop(0.42,'#006400'); // green
  grass.addColorStop(0.62,'#38b000'); // bright-fern
  grass.addColorStop(0.82,'#70e000'); // radioactive-grass
  grass.addColorStop(0.94,'#9ef01a'); // slime-lime
  grass.addColorStop(1,   '#aadd11'); // toned chartreuse (not full neon)
  bgCtx.fillStyle=grass;
  bgCtx.fillRect(0,horizonY,W,H-horizonY);

  // Wide soft blend at horizon — pulls sky coral into the ground dark
  const blend=bgCtx.createLinearGradient(0,horizonY-40,0,horizonY+40);
  blend.addColorStop(0,   'rgba(239,122,133,0)');
  blend.addColorStop(0.38,'rgba(239,122,133,0.22)');
  blend.addColorStop(0.5, 'rgba(16,8,24,0.55)');
  blend.addColorStop(0.62,'rgba(0,26,12,0.4)');
  blend.addColorStop(1,   'rgba(0,26,12,0)');
  bgCtx.fillStyle=blend;
  bgCtx.fillRect(0,horizonY-40,W,80);

  // Grass blades
  drawGrass(t);

  // Side vignettes — subtle, just enough to let trees emerge from darkness
  const vL=bgCtx.createLinearGradient(0,0,W*0.15,0);
  vL.addColorStop(0,'rgba(8,2,22,0.75)'); vL.addColorStop(1,'rgba(8,2,22,0)');
  bgCtx.fillStyle=vL; bgCtx.fillRect(0,0,W*0.15,H);
  const vR=bgCtx.createLinearGradient(W,0,W*0.85,0);
  vR.addColorStop(0,'rgba(8,2,22,0.75)'); vR.addColorStop(1,'rgba(8,2,22,0)');
  bgCtx.fillStyle=vR; bgCtx.fillRect(W*0.85,0,W*0.15,H);

  // Top vignette
  const vT=bgCtx.createLinearGradient(0,0,0,H*0.1);
  vT.addColorStop(0,'rgba(6,1,20,0.6)'); vT.addColorStop(1,'rgba(6,1,20,0)');
  bgCtx.fillStyle=vT; bgCtx.fillRect(0,0,W,H*0.1);
}

// ── GRASS BLADES ─────────────────────────────────────────────
const BLADES=200;
const blades=Array.from({length:BLADES},()=>({
  x:Math.random(),
  y:0.52+Math.random()*0.48,
  h:0.015+Math.random()*0.05,
  w:1+Math.random()*2,
  ph:Math.random()*Math.PI*2,
  spd:0.6+Math.random()*0.9,
  lean:(Math.random()-0.5)*0.15,
})).sort((a,b)=>a.y-b.y);

function drawGrass(t){
  const w=windStrength+windGust;
  blades.forEach(b=>{
    const depth=(b.y-0.52)/0.48; // 0=far,1=near
    const bx=b.x*W, by=b.y*H, bh=b.h*H;
    // Near blades: chartreuse. Far blades: dark spruce.
    const gr=Math.round(depth*80);
    const gg=Math.round(75+depth*180);
    const gb=0;
    const alpha=0.35+depth*0.55;
    const sway=(Math.sin(windTime*b.spd+b.ph)*w*0.5+b.lean)*bh*0.55;
    bgCtx.save();
    bgCtx.globalAlpha=alpha;
    bgCtx.strokeStyle=`rgb(${gr},${gg},${gb})`;
    bgCtx.lineWidth=b.w*(0.4+depth*0.9);
    bgCtx.lineCap='round';
    bgCtx.beginPath();
    bgCtx.moveTo(bx,by);
    bgCtx.quadraticCurveTo(bx+sway*0.5,by-bh*0.5,bx+sway,by-bh);
    bgCtx.stroke();
    bgCtx.restore();
  });
}

// ── LIGHTING ─────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0xb892ff,0x004b23,1.4));
const rim=new THREE.DirectionalLight(0xff90b3,1.1);
rim.position.set(2,14,-30); scene.add(rim);
const fill=new THREE.DirectionalLight(0x9966ee,0.5);
fill.position.set(-3,6,55); scene.add(fill);

// ── WIND SHADER ──────────────────────────────────────────────
const WIND_GLSL=`
  float wp=uT*1.05+position.x*0.25+uPh;
  float ws=sin(wp)*uW+sin(uT*0.68+uPh*1.3)*uW*0.38;
  float hf=clamp(transformed.y/uH,0.0,1.0); hf*=hf;
  transformed.x+=ws*hf*0.28;
  transformed.z+=ws*hf*0.09;
`;
const allU=[];
function patchWind(mat,ph,h){
  const u={uT:{value:0},uW:{value:0},uPh:{value:ph},uH:{value:h}};
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,u);
    sh.vertexShader=`uniform float uT,uW,uPh,uH;\n`+sh.vertexShader;
    sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n'+WIND_GLSL);
  };
  mat.needsUpdate=true; allU.push(u);
}
function updateWind(t){
  const w=windStrength+windGust;
  allU.forEach(u=>{u.uT.value=t;u.uW.value=w;});
}

// ── TREE PLACEMENT ───────────────────────────────────────────
/*
  Camera at Z=55, FOV=42°: half-width ≈ tan(21°)*55 ≈ 21.1
  We want a CLEARING in the centre (middle ~40% of screen width).
  Trees are on the sides — like standing in a glade looking out.

  Layout (top-down view, camera at bottom):
  far background:    [bg-L]         [bg-R]       z=-20
  mid background:  [mid-L]   gap   [mid-R]       z=  5
  foreground:    [fg-L]    clearing   [fg-R]      z= 22
  near flankers: [nf-L]               [nf-R]      z= 38

  dk = brightness multiplier. Higher = more visible.
*/
function placeTrees(tmpl){
  const trees=[
    // Far background — closes the clearing at distance
    {x:-10, z: 20, sx:0.9, sy:1.2, ry:0.9,  ph:3.1, dk:0.7},
    {x: 10, z: 20, sx:0.8, sy:1.1, ry:-1.1, ph:1.4, dk:0.7},
  
    // Mid background
    {x:-22, z: 35, sx:1.1, sy:1.5, ry:0.5,  ph:2.2, dk:0.78},
    {x: 22, z: 35, sx:1.0, sy:1.4, ry:-0.7, ph:0.8, dk:0.78},
  
    // Foreground — wide spread, frame the sides
    {x:-35, z: 46, sx:1.3, sy:1.8, ry:0.2,  ph:1.8, dk:0.85},
    {x: 35, z: 46, sx:1.2, sy:1.7, ry:-0.3, ph:2.7, dk:0.85},
  
    // Near flankers — partially off-screen edges
    {x:-50, z: 52, sx:1.5, sy:2.0, ry:0.1,  ph:0.4, dk:0.92},
    {x: 50, z: 52, sx:1.4, sy:1.9, ry:-0.15,ph:3.5, dk:0.92},
  ];
  trees.forEach(p=>{
    const clone=tmpl.clone(true);
    clone.scale.set(p.sx,p.sy,p.sx);
    clone.rotation.y=p.ry;
    clone.position.set(p.x,0,p.z);
    const h=5*p.sy;
    clone.traverse(child=>{
      if(!child.isMesh) return;
      child.material=child.material.clone();
      const c=child.material.color||new THREE.Color(1,1,1);
      child.material.color=c.clone().multiplyScalar(p.dk);
      if(child.material.alphaMap||child.material.name==='leaves'){
        child.material.alphaTest=0.45;
        child.material.transparent=true;
        child.material.side=THREE.DoubleSide;
      }
      patchWind(child.material,p.ph,h);
    });
    scene.add(clone);
  });
}

const loader=new THREE.GLTFLoader();
loader.load('tree.glb',gltf=>{
  placeTrees(gltf.scene);
  fadeIn();
},null,err=>{console.error(err);fadeIn();});

// ── PERSON ───────────────────────────────────────────────────
// Raw model bounds: Y min=-0.156, max=0.131, total height=0.287 units
// Scale 18 → person is ~5.2 units tall (readable in scene)
// Y position: sink just enough to hide the very bottom edge
//   bottom of model after scale = -0.156 * 18 = -2.808
//   we want ground at Y=0, so lift by 2.808, then sink 0.3 extra to bury feet
//   final Y = 2.808 - 0.3 = 2.508
// Z=-10: middle-distance, visible in the clearing gap between trees
const personLoader=new THREE.GLTFLoader();
personLoader.load('person.glb',gltf=>{
  const person=gltf.scene;
  const s=18;
  person.scale.set(s,s,s);
  person.position.set(0, (-0.156*s)+2, 25); // z=25, visible in the clearing
  person.traverse(child=>{
    if(!child.isMesh) return;
    child.material=child.material.clone();
    child.material.emissive=new THREE.Color(0x1a0030);
    child.material.emissiveIntensity=0.25;
  });
  scene.add(person);
},null,err=>console.error('person.glb failed:',err));

function fadeIn(){
  setTimeout(()=>{
    document.getElementById('loading').classList.add('fade');
    setTimeout(()=>document.getElementById('loading').remove(),1700);
    document.getElementById('label').classList.add('visible');
    document.getElementById('next').classList.add('visible');
    document.getElementById('mute').classList.add('visible');
  },500);
}

// ── AUDIO — constant ambient wind ────────────────────────────
// Default: muted. Click speaker to unmute.
let audioOn=false,isMuted=true,masterGain;

async function initAudio(){
  if(audioOn)return; audioOn=true; await Tone.start();

  // masterGain = mute switch only, starts at 0
  masterGain=new Tone.Gain(0).toDestination();

  // subGain = level + LFO swell (never touches masterGain so mute always works)
  const subGain=new Tone.Gain(0.3).connect(masterGain);
  const lfo=new Tone.LFO({frequency:0.04,min:0.75,max:1.0,type:'sine'});
  lfo.connect(subGain.gain); lfo.start();

  // Low rumble
  const brown=new Tone.Noise('brown');
  const lowpass=new Tone.Filter(180,'lowpass');
  const brownGain=new Tone.Gain(0.7).connect(subGain);
  brown.connect(lowpass); lowpass.connect(brownGain); brown.start();

  // Mid whoosh
  const pink=new Tone.Noise('pink');
  const bandpass=new Tone.Filter({frequency:600,type:'bandpass',Q:0.6});
  const pinkGain=new Tone.Gain(0.45).connect(subGain);
  pink.connect(bandpass); bandpass.connect(pinkGain); pink.start();
}

// Icon starts in muted state
document.getElementById('wave1').style.opacity='0.15';
document.getElementById('wave2').style.opacity='0.15';

document.getElementById('mute').addEventListener('click',async ()=>{
  isMuted=!isMuted;
  if(!audioOn) await initAudio(); // start audio on first unmute
  if(masterGain) masterGain.gain.rampTo(isMuted?0:1,0.6);
  document.getElementById('wave1').style.opacity=isMuted?'0.15':'1';
  document.getElementById('wave2').style.opacity=isMuted?'0.15':'1';
});

// ── LOOP ─────────────────────────────────────────────────────
let t=0,lastT=null;
(function frame(now){
  if(!lastT)lastT=now;
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now; t+=dt;
  tickWind(dt);
  updateWind(t);
  drawBG(t);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
})(performance.now());

document.getElementById('next').addEventListener('click',()=>{
  document.body.style.transition='opacity 1.2s ease';
  document.body.style.opacity='0';
  setTimeout(()=>{window.location.href='02.html';},1200);
});
</script>
</body>
</html>
