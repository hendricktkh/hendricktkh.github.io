<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 — clearing</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a110a; }

#bg-canvas {
  position:fixed; inset:0; z-index:0;
}
#three-canvas {
  position:fixed; inset:0; z-index:1;
  pointer-events:none;
}
/* grain overlay */
#grain {
  position:fixed; inset:-50%; width:200%; height:200%;
  pointer-events:none; z-index:20; opacity:0.025;
  animation:grainShift 0.14s steps(1) infinite;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}
@keyframes grainShift {
  0%  { transform:translate(0,0); }
  20% { transform:translate(-3%,-4%); }
  40% { transform:translate(4%,2%); }
  60% { transform:translate(-2%,5%); }
  80% { transform:translate(5%,-2%); }
}

#label {
  position:fixed; top:1.8rem; left:2rem; z-index:100;
  font-family:'Georgia',serif; font-size:0.7rem; letter-spacing:0.18em;
  color:rgba(180,210,160,0.25); text-transform:uppercase;
  opacity:0; transition:opacity 2s ease; user-select:none;
}
#label.visible { opacity:1; }

#next {
  position:fixed; bottom:2rem; right:2.2rem; z-index:100;
  width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  border:none; background:none; cursor:pointer;
  opacity:0; transition:opacity 1.2s ease;
}
#next.visible { opacity:1; }
#next svg { width:28px; height:28px; stroke:rgba(180,210,150,0.4); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; transition:stroke .3s,transform .3s; }
#next:hover svg { stroke:rgba(210,240,180,0.85); transform:translateX(4px); }

#mute {
  position:fixed; bottom:2rem; left:2rem; z-index:100;
  background:none; border:none; cursor:pointer;
  opacity:0; transition:opacity 1.2s ease; padding:4px;
}
#mute.visible { opacity:1; }
#mute svg { width:20px; height:20px; stroke:rgba(180,210,150,0.3); fill:none; stroke-width:1.4; stroke-linecap:round; transition:stroke .3s; }
#mute:hover svg { stroke:rgba(200,230,170,0.7); }

#loading {
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  background:#0a110a;
  font-family:'Georgia',serif; font-size:0.72rem; letter-spacing:0.22em;
  color:rgba(160,200,130,0.35); text-transform:uppercase;
  transition:opacity 1.6s ease;
}
#loading.fade { opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div id="loading">entering</div>
<canvas id="bg-canvas"></canvas>
<canvas id="three-canvas"></canvas>
<div id="grain"></div>

<div id="label">01 — clearing</div>

<button id="mute" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path id="wave1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path id="wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </svg>
</button>

<button id="next" aria-label="Next room">
  <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

<script>
// ============================================================
// SETUP
// ============================================================
let W = window.innerWidth, H = window.innerHeight;

const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');

function resizeCanvases() {
  W = window.innerWidth; H = window.innerHeight;
  bgCanvas.width = W; bgCanvas.height = H;
}
resizeCanvases();
window.addEventListener('resize', () => {
  resizeCanvases();
  camera.aspect = W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});

// ============================================================
// WIND
// ============================================================
let windTime=0, windStrength=0, windTarget=0, windGust=0;

function tickWind(dt) {
  windTime += dt*0.35;
  if (Math.random()<0.007) windTarget = (Math.random()-0.35)*1.2;
  windStrength += (windTarget-windStrength)*0.01;
  if (Math.random()<0.003) windGust = (Math.random()*0.7+0.2)*Math.sign(windStrength||1);
  windGust *= 0.975;
}

// ============================================================
// BG — sky, ground, backlit glow, depth layers, fog
// ============================================================
function drawBG(t) {
  bgCtx.clearRect(0,0,W,H);

  // ---- SKY — overcast, cool, slightly luminous in centre ----
  const sky = bgCtx.createLinearGradient(0,0,0,H*0.52);
  sky.addColorStop(0,   '#8ea882');   // muted grey-green canopy zone
  sky.addColorStop(0.35,'#adc49a');   // lighter mid
  sky.addColorStop(0.7, '#c8d8b4');   // bright diffuse light through gap
  sky.addColorStop(1,   '#b8cfa0');
  bgCtx.fillStyle = sky;
  bgCtx.fillRect(0,0,W,H*0.52);

  // Backlit glow in clearing centre — the key light of the scene
  const glowY = H*0.44;
  const glow = bgCtx.createRadialGradient(W/2, glowY, 0, W/2, glowY, W*0.28);
  glow.addColorStop(0,   'rgba(220,240,195,0.62)');
  glow.addColorStop(0.4, 'rgba(185,215,155,0.28)');
  glow.addColorStop(1,   'rgba(140,180,110,0)');
  bgCtx.fillStyle = glow;
  bgCtx.fillRect(0,0,W,H*0.52);

  // ---- GROUND — flat, dark, mossy ----
  const grd = bgCtx.createLinearGradient(0, H*0.5, 0, H);
  grd.addColorStop(0,   '#1c2a18');
  grd.addColorStop(0.18,'#182415');
  grd.addColorStop(0.5, '#111b0f');
  grd.addColorStop(1,   '#090e08');
  bgCtx.fillStyle = grd;
  bgCtx.fillRect(0, H*0.5, W, H*0.5);

  // Clearing floor slightly lit — light pools in centre
  const floorGlow = bgCtx.createRadialGradient(W/2, H*0.6, 0, W/2, H*0.68, W*0.22);
  floorGlow.addColorStop(0,   'rgba(80,110,55,0.38)');
  floorGlow.addColorStop(0.5, 'rgba(50,75,35,0.18)');
  floorGlow.addColorStop(1,   'rgba(20,35,14,0)');
  bgCtx.fillStyle = floorGlow;
  bgCtx.fillRect(0, H*0.5, W, H*0.5);

  // ---- DEPTH LAYERS — mid-distance tree masses ----
  // These are painted 2D tree silhouettes in middle distance
  // so the 3D GLB trees frame them from the front
  drawMidTrees(t);

  // ---- FOG / atmospheric haze ----
  // Low mist sitting just above ground
  for (let i=0; i<4; i++) {
    const ph = i*1.7 + t*0.03;
    const cx = W*0.5 + Math.sin(ph)*W*0.18 + i*W*0.12 - W*0.18;
    const ry = H*0.045;
    const rx = W*(0.18+0.08*Math.sin(ph*0.5));
    const cy = H*(0.58 + 0.04*Math.sin(ph*0.6));
    const fog = bgCtx.createRadialGradient(cx,cy,0, cx,cy,Math.max(rx,ry));
    fog.addColorStop(0,   'rgba(175,210,150,0.055)');
    fog.addColorStop(0.6, 'rgba(155,195,130,0.022)');
    fog.addColorStop(1,   'transparent');
    bgCtx.save();
    bgCtx.scale(1, ry/rx);
    bgCtx.beginPath();
    bgCtx.arc(cx, cy*(rx/ry), rx, 0, Math.PI*2);
    bgCtx.fillStyle = fog;
    bgCtx.fill();
    bgCtx.restore();
  }

  // ---- VIGNETTE — heavy on sides, lighter top/bottom ----
  // Left edge darkness (behind left foreground tree)
  const vL = bgCtx.createLinearGradient(0,0,W*0.28,0);
  vL.addColorStop(0,   'rgba(5,10,4,0.88)');
  vL.addColorStop(0.5, 'rgba(5,10,4,0.35)');
  vL.addColorStop(1,   'rgba(5,10,4,0)');
  bgCtx.fillStyle = vL;
  bgCtx.fillRect(0,0,W*0.28,H);

  // Right edge
  const vR = bgCtx.createLinearGradient(W,0,W*0.72,0);
  vR.addColorStop(0,   'rgba(5,10,4,0.88)');
  vR.addColorStop(0.5, 'rgba(5,10,4,0.35)');
  vR.addColorStop(1,   'rgba(5,10,4,0)');
  bgCtx.fillStyle = vR;
  bgCtx.fillRect(W*0.72,0,W*0.28,H);

  // Top — canopy darkness
  const vT = bgCtx.createLinearGradient(0,0,0,H*0.22);
  vT.addColorStop(0,   'rgba(4,8,3,0.75)');
  vT.addColorStop(1,   'rgba(4,8,3,0)');
  bgCtx.fillStyle = vT;
  bgCtx.fillRect(0,0,W,H*0.22);

  // Bottom
  const vB = bgCtx.createLinearGradient(0,H,0,H*0.78);
  vB.addColorStop(0,   'rgba(4,8,3,0.65)');
  vB.addColorStop(1,   'rgba(4,8,3,0)');
  bgCtx.fillStyle = vB;
  bgCtx.fillRect(0,H*0.78,W,H*0.22);
}

// ---- Mid-distance 2D painted trees ----
// These read as the lighter trees visible through the gap in the photo
function drawMidTrees(t) {
  const horizon = H*0.5;
  const midTrees = [
    // cx, baseY, height, trunkW, canopyR, phase
    { cx:W*0.38, h:H*0.28, tw:3,  cr:W*0.04, ph:0.3  },
    { cx:W*0.42, h:H*0.32, tw:2,  cr:W*0.03, ph:1.1  },
    { cx:W*0.48, h:H*0.38, tw:2.5,cr:W*0.035,ph:2.0  },
    { cx:W*0.53, h:H*0.30, tw:2,  cr:W*0.032,ph:0.8  },
    { cx:W*0.58, h:H*0.26, tw:3,  cr:W*0.038,ph:1.6  },
    { cx:W*0.62, h:H*0.34, tw:2.5,cr:W*0.03, ph:2.4  },
    { cx:W*0.33, h:H*0.22, tw:2,  cr:W*0.028,ph:0.5  },
    { cx:W*0.67, h:H*0.24, tw:2,  cr:W*0.026,ph:1.8  },
    // Tall thin conifers in background
    { cx:W*0.44, h:H*0.42, tw:1.5,cr:W*0.018,ph:0.9, conifer:true },
    { cx:W*0.55, h:H*0.4,  tw:1.5,cr:W*0.016,ph:2.1, conifer:true },
    { cx:W*0.50, h:H*0.44, tw:1.5,cr:W*0.015,ph:1.4, conifer:true },
  ];

  midTrees.forEach(tr => {
    const baseY = horizon;
    const wind  = (windStrength+windGust);
    const sway  = Math.sin(windTime*1.0+tr.ph)*wind*0.012;

    bgCtx.save();
    bgCtx.globalAlpha = 0.82;

    if (tr.conifer) {
      // Tall thin conifer — spire shape
      const col = bgCtx.createLinearGradient(tr.cx-tr.cr,baseY-tr.h, tr.cx+tr.cr, baseY);
      col.addColorStop(0, 'rgba(90,125,70,0.55)');
      col.addColorStop(1, 'rgba(55,80,42,0.4)');
      bgCtx.fillStyle = col;
      bgCtx.beginPath();
      bgCtx.moveTo(tr.cx + sway*tr.h, baseY - tr.h);
      bgCtx.lineTo(tr.cx + sway*tr.h*0.5 + tr.cr*0.9, baseY - tr.h*0.55);
      bgCtx.lineTo(tr.cx + sway*tr.h*0.3 + tr.cr*1.4, baseY - tr.h*0.25);
      bgCtx.lineTo(tr.cx + tr.tw*0.6, baseY);
      bgCtx.lineTo(tr.cx - tr.tw*0.6, baseY);
      bgCtx.lineTo(tr.cx - sway*tr.h*0.3 - tr.cr*1.4, baseY - tr.h*0.25);
      bgCtx.lineTo(tr.cx - sway*tr.h*0.5 - tr.cr*0.9, baseY - tr.h*0.55);
      bgCtx.closePath();
      bgCtx.fill();
    } else {
      // Deciduous — rounded canopy, lit from behind/above
      const topX = tr.cx + sway*tr.h;
      const topY = baseY - tr.h;

      // Trunk
      bgCtx.fillStyle = 'rgba(30,42,24,0.7)';
      bgCtx.beginPath();
      bgCtx.moveTo(tr.cx - tr.tw*0.5, baseY);
      bgCtx.quadraticCurveTo(tr.cx + sway*tr.h*0.4, baseY-tr.h*0.5, topX, topY+tr.cr*0.6);
      bgCtx.lineTo(topX + tr.tw*0.6, topY+tr.cr*0.6);
      bgCtx.quadraticCurveTo(tr.cx + sway*tr.h*0.4 + tr.tw, baseY-tr.h*0.5, tr.cx+tr.tw*0.5, baseY);
      bgCtx.closePath();
      bgCtx.fill();

      // Canopy — backlit so bright fringe, dark centre
      const cg = bgCtx.createRadialGradient(
        topX - tr.cr*0.2, topY - tr.cr*0.2, 0,
        topX, topY, tr.cr
      );
      cg.addColorStop(0,   'rgba(100,145,75,0.5)');
      cg.addColorStop(0.5, 'rgba(80,118,58,0.55)');
      cg.addColorStop(0.8, 'rgba(60,90,44,0.45)');
      cg.addColorStop(1,   'rgba(165,210,130,0.15)'); // light fringe
      bgCtx.fillStyle = cg;
      bgCtx.beginPath();
      for (let a=0; a<Math.PI*2; a+=0.2) {
        const r = tr.cr*(0.82 + 0.2*Math.sin(a*3.3+tr.ph));
        const px = topX + Math.cos(a)*r;
        const py = topY + Math.sin(a)*r*0.82;
        a===0 ? bgCtx.moveTo(px,py) : bgCtx.lineTo(px,py);
      }
      bgCtx.closePath();
      bgCtx.fill();
    }

    bgCtx.restore();
  });
}

// ============================================================
// THREE.JS
// ============================================================
const threeCanvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas:threeCanvas, alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();

// Camera — slightly low, looking slightly up into the canopy
const camera = new THREE.PerspectiveCamera(48, W/H, 0.1, 500);
camera.position.set(0, 1.8, 14);
camera.lookAt(0, 3.5, 0);

// Lighting matches the photo:
// Soft diffuse overcast from above/behind, no hard sun
const skyLight = new THREE.HemisphereLight(
  0xa8c888,  // sky — cool green-white
  0x1a2a12,  // ground bounce — dark
  1.4
);
scene.add(skyLight);

// Subtle backlight from centre — the glow in the gap
const backLight = new THREE.DirectionalLight(0xc8e0a8, 0.9);
backLight.position.set(0, 8, -10);
scene.add(backLight);

// Very faint front fill so trunks aren't pure black
const fillLight = new THREE.DirectionalLight(0x6a8855, 0.22);
fillLight.position.set(0, 4, 14);
scene.add(fillLight);

// Wind shader — vertex displacement
const WIND_VERT = `
  float wPhase = uWindTime * 1.05 + position.x * 0.25 + uPhase;
  float ws = sin(wPhase) * uWind + sin(uWindTime*0.68 + uPhase*1.3) * uWind * 0.38;
  float hf = clamp(transformed.y / uH, 0.0, 1.0);
  hf = hf * hf;
  transformed.x += ws * hf * 0.28;
  transformed.z += ws * hf * 0.09;
`;

const allWindUs = [];

function patchWind(mat, phase, treeH) {
  const u = {
    uWindTime: {value:0}, uWind: {value:0},
    uPhase: {value:phase}, uH: {value:treeH}
  };
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    sh.vertexShader = `uniform float uWindTime,uWind,uPhase,uH;\n` + sh.vertexShader;
    sh.vertexShader = sh.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n' + WIND_VERT
    );
    mat._su = u;
  };
  mat._u = u;
  mat.needsUpdate = true;
  allWindUs.push(u);
  return u;
}

function updateWind(t) {
  const w = windStrength + windGust;
  allWindUs.forEach(u => { u.uWindTime.value=t; u.uWind.value=w; });
}

// Load GLB
const loader = new THREE.GLTFLoader();
loader.load('tree.glb', gltf => {
  placeTrees(gltf.scene);
  fadeIn();
}, null, err => { console.error(err); fadeIn(); });

function placeTrees(tmpl) {
  // Camera FOV half-width at Z=0: tan(24°)*14 ≈ 6.2
  const halfW = Math.tan((48/2)*Math.PI/180) * 14;

  // --- TWO DOMINANT FOREGROUND TREES — close to edges, large ---
  // Left tree
  placeTree(tmpl, {
    x: -halfW * 0.72,  // close to left edge
    y: 0, z: 6,        // close to camera
    sx: 1.55, sy: 1.7, sz: 1.55,
    ry: 0.3,
    phase: 0.4,
    darken: 0.18,       // nearly silhouette
  });

  // Right tree
  placeTree(tmpl, {
    x: halfW * 0.72,
    y: 0, z: 6,
    sx: 1.45, sy: 1.65, sz: 1.45,
    ry: -0.5,
    phase: 1.8,
    darken: 0.18,
  });

  // --- SECONDARY FOREGROUND TREES — slightly behind, smaller ---
  placeTree(tmpl, {
    x: -halfW * 0.52,
    y: 0, z: 2,
    sx: 1.1, sy: 1.3, sz: 1.1,
    ry: 0.9, phase: 2.2, darken: 0.22,
  });
  placeTree(tmpl, {
    x: halfW * 0.5,
    y: 0, z: 2,
    sx: 1.0, sy: 1.25, sz: 1.0,
    ry: -1.1, phase: 0.7, darken: 0.22,
  });

  // --- MID-DEPTH TREES — further back, flanking clearing ---
  [
    { x:-halfW*0.35, z:-4, sx:0.75, sy:0.9,  ry:1.4,  ph:1.2, dk:0.35 },
    { x: halfW*0.35, z:-4, sx:0.7,  sy:0.85, ry:-1.6, ph:2.8, dk:0.35 },
    { x:-halfW*0.55, z:-2, sx:0.9,  sy:1.0,  ry:0.6,  ph:3.5, dk:0.28 },
    { x: halfW*0.55, z:-2, sx:0.85, sy:0.95, ry:-0.8, ph:1.9, dk:0.28 },
    { x:-halfW*0.2,  z:-7, sx:0.55, sy:0.7,  ry:2.1,  ph:0.3, dk:0.5  },
    { x: halfW*0.2,  z:-7, sx:0.5,  sy:0.65, ry:-2.3, ph:2.5, dk:0.5  },
    { x:-halfW*0.7,  z: 0, sx:0.85, sy:1.1,  ry:0.2,  ph:3.1, dk:0.2  },
    { x: halfW*0.7,  z: 0, sx:0.8,  sy:1.05, ry:-0.4, ph:1.5, dk:0.2  },
  ].forEach(p => {
    placeTree(tmpl, {
      x:p.x, y:0, z:p.z,
      sx:p.sx, sy:p.sy, sz:p.sx,
      ry:p.ry, phase:p.ph, darken:p.dk,
    });
  });
}

function placeTree(tmpl, opts) {
  const clone = tmpl.clone(true);
  clone.scale.set(opts.sx, opts.sy, opts.sz);
  clone.rotation.y = opts.ry;
  clone.position.set(opts.x, opts.y, opts.z);

  const treeH = 5 * opts.sy;
  const phase = opts.phase;
  const dk    = opts.darken;

  clone.traverse(child => {
    if (!child.isMesh) return;
    child.material = child.material.clone();

    // Darken toward silhouette — foreground trees nearly black
    if (!child.material.color) child.material.color = new THREE.Color(1,1,1);
    child.material.color.multiplyScalar(dk);

    // Leaves
    if (child.material.name === 'leaves') {
      child.material.alphaTest = 0.45;
      child.material.transparent = true;
      child.material.side = THREE.DoubleSide;
    }

    patchWind(child.material, phase, treeH);
  });

  scene.add(clone);
}

// ============================================================
// AUDIO
// ============================================================
let audioOn=false, isMuted=false, masterGain, rustleEnv;

async function startAudio() {
  if (audioOn) return; audioOn=true;
  await Tone.start();
  masterGain = new Tone.Gain(0.65).toDestination();

  // Wind
  const wn = new Tone.Noise('pink');
  const wf = new Tone.Filter(300,'bandpass'); wf.Q.value=0.5;
  const wg = new Tone.Gain(0).connect(masterGain);
  wn.connect(wf); wf.connect(wg); wn.start();
  const lfo = new Tone.LFO({frequency:0.06,min:0,max:0.16}).connect(wg.gain); lfo.start();

  // Birds
  (function chirp() {
    if (isMuted) { setTimeout(chirp,3000+Math.random()*8000); return; }
    const o=new Tone.Oscillator(1600+Math.random()*1800,'sine');
    const e=new Tone.AmplitudeEnvelope({attack:0.04,decay:0.14,sustain:0.18,release:0.5});
    const g=new Tone.Gain(0.035).connect(masterGain);
    const p=new Tone.Panner(Math.random()*2-1).connect(g);
    o.connect(e); e.connect(p); o.start(); e.triggerAttackRelease(0.08+Math.random()*0.18);
    setTimeout(()=>o.dispose(),1500);
    setTimeout(chirp,2500+Math.random()*9000);
  })();

  // Leaves
  const ln=new Tone.Noise('white');
  const lf=new Tone.Filter(3200,'bandpass'); lf.Q.value=2.2;
  rustleEnv=new Tone.AmplitudeEnvelope({attack:0.04,decay:0.28,sustain:0,release:0.5});
  const lg=new Tone.Gain(0.08).connect(masterGain);
  ln.connect(lf); lf.connect(rustleEnv); rustleEnv.connect(lg); ln.start();
  (function ar() {
    if(!isMuted) rustleEnv.triggerAttackRelease(0.15+Math.random()*0.35);
    setTimeout(ar,1500+Math.random()*5000);
  })();

  // Rumble
  const rn=new Tone.Noise('brown');
  const rf=new Tone.Filter(70,'lowpass');
  const rg=new Tone.Gain(0.055).connect(masterGain);
  rn.connect(rf); rf.connect(rg); rn.start();
}

document.getElementById('mute').addEventListener('click', ()=>{
  isMuted=!isMuted;
  if(masterGain) masterGain.gain.rampTo(isMuted?0:0.65,0.4);
  document.getElementById('wave1').style.opacity=isMuted?'0.15':'1';
  document.getElementById('wave2').style.opacity=isMuted?'0.15':'1';
});
document.addEventListener('click', startAudio, {once:true});
document.addEventListener('keydown', startAudio, {once:true});

// ============================================================
// LOOP
// ============================================================
let t=0, lastT=null;

function frame(now) {
  if(!lastT) lastT=now;
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now; t+=dt;

  tickWind(dt);
  updateWind(t);
  drawBG(t);
  renderer.render(scene, camera);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function fadeIn() {
  setTimeout(()=>{
    document.getElementById('loading').classList.add('fade');
    setTimeout(()=>document.getElementById('loading').remove(),1700);
    document.getElementById('label').classList.add('visible');
    document.getElementById('next').classList.add('visible');
    document.getElementById('mute').classList.add('visible');
  }, 600);
}

document.getElementById('next').addEventListener('click', ()=>{
  document.body.style.transition='opacity 1.2s ease';
  document.body.style.opacity='0';
  setTimeout(()=>{ window.location.href='02.html'; },1200);
});
</script>
