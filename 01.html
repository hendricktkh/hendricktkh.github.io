<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 — clearing</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0d1a0e; }

#bg-canvas {
  position:fixed; inset:0;
  filter: hue-rotate(8deg) saturate(0.82);
  z-index:0;
}
#three-canvas {
  position:fixed; inset:0;
  z-index:1;
  pointer-events:none;
}
#interact-canvas {
  position:fixed; inset:0;
  z-index:2;
}

#grade {
  position:fixed; inset:0; z-index:10; pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 50% 55%, transparent 30%, rgba(4,12,5,0.55) 100%),
    linear-gradient(to bottom, rgba(255,160,60,0.08) 0%, rgba(255,200,100,0.04) 30%, transparent 60%, rgba(10,25,12,0.18) 100%);
}
#grain {
  position:fixed; inset:-50%; width:200%; height:200%;
  pointer-events:none; z-index:11; opacity:0.03;
  animation:grainShift 0.12s steps(1) infinite;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}
@keyframes grainShift {
  0%  { transform:translate(0,0); }
  20% { transform:translate(-3%,-4%); }
  40% { transform:translate(4%,2%); }
  60% { transform:translate(-2%,5%); }
  80% { transform:translate(5%,-2%); }
}

#label {
  position:fixed; top:1.8rem; left:2rem; z-index:100;
  font-family:'Georgia',serif; font-size:0.7rem; letter-spacing:0.18em;
  color:rgba(200,220,180,0.3); text-transform:uppercase;
  opacity:0; transition:opacity 2s ease; user-select:none;
}
#label.visible { opacity:1; }

#next {
  position:fixed; bottom:2rem; right:2.2rem; z-index:100;
  width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  border:none; background:none; cursor:pointer;
  opacity:0; transition:opacity 1.2s ease;
}
#next.visible { opacity:1; }
#next svg { width:28px; height:28px; stroke:rgba(220,200,160,0.55); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; transition:stroke .3s,transform .3s; }
#next:hover svg { stroke:rgba(255,220,140,0.9); transform:translateX(4px); }

#mute {
  position:fixed; bottom:2rem; left:2rem; z-index:100;
  background:none; border:none; cursor:pointer;
  opacity:0; transition:opacity 1.2s ease; padding:4px;
}
#mute.visible { opacity:1; }
#mute svg { width:20px; height:20px; stroke:rgba(200,200,180,0.4); fill:none; stroke-width:1.4; stroke-linecap:round; transition:stroke .3s; }
#mute:hover svg { stroke:rgba(220,210,170,0.8); }

#loading {
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  background:#0d1a0e;
  font-family:'Georgia',serif; font-size:0.75rem; letter-spacing:0.2em;
  color:rgba(180,210,150,0.4); text-transform:uppercase;
  transition:opacity 1.5s ease;
}
#loading.fade { opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div id="loading">entering</div>

<canvas id="bg-canvas"></canvas>
<canvas id="three-canvas"></canvas>
<canvas id="interact-canvas"></canvas>

<div id="grade"></div>
<div id="grain"></div>

<div id="label">01 — clearing</div>

<button id="mute" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path id="wave1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path id="wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </svg>
</button>

<button id="next" aria-label="Next room">
  <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<!-- Three.js r128 + GLTFLoader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

<script>
// ============================================================
// GLOBALS
// ============================================================
let W = window.innerWidth, H = window.innerHeight;
const CLEARING_FRAC = 0.27; // fraction of W that is clearing half-width

// ============================================================
// 2D BG CANVAS — sky, ground, rays, grass, fog
// ============================================================
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');

const iCanvas  = document.getElementById('interact-canvas');
const iCtx     = iCanvas.getContext('2d');

function resizeCanvases() {
  W = window.innerWidth; H = window.innerHeight;
  bgCanvas.width  = iCanvas.width  = W;
  bgCanvas.height = iCanvas.height = H;
}
resizeCanvases();

// ============================================================
// WIND
// ============================================================
let windTime = 0, windStrength = 0, windTarget = 0, windGust = 0;

function tickWind(dt) {
  windTime += dt * 0.4;
  if (Math.random() < 0.008) windTarget = (Math.random() - 0.3) * 1.4;
  windStrength += (windTarget - windStrength) * 0.012;
  if (Math.random() < 0.003) windGust = (Math.random()*0.8+0.3) * Math.sign(windStrength||1);
  windGust *= 0.97;
}
function windAt(x, phase, t) {
  const w = windStrength + windGust;
  return Math.sin(t*1.1+phase+x*0.003)*w + Math.sin(t*0.7+phase*1.3)*w*0.4;
}

// ============================================================
// SKY + GROUND
// ============================================================
function drawSky() {
  const g = bgCtx.createLinearGradient(0,0,0,H*0.55);
  g.addColorStop(0,   '#8fba6a');
  g.addColorStop(0.4, '#c8dfa2');
  g.addColorStop(0.75,'#e8c97a');
  g.addColorStop(1,   '#d4a85a');
  bgCtx.fillStyle = g;
  bgCtx.fillRect(0,0,W,H*0.55);
}

function drawGround() {
  const g = bgCtx.createLinearGradient(0,H*0.48,0,H);
  g.addColorStop(0, '#1a2e14');
  g.addColorStop(0.3,'#1e3318');
  g.addColorStop(1, '#0d1a0e');
  bgCtx.fillStyle = g;
  bgCtx.fillRect(0,H*0.48,W,H*0.52);

  const CX = W/2;
  const cg = bgCtx.createRadialGradient(CX,H*0.72,0, CX,H*0.72, CLEARING_FRAC*W*1.1);
  cg.addColorStop(0,   'rgba(100,145,55,0.55)');
  cg.addColorStop(0.5, 'rgba(70,105,38,0.3)');
  cg.addColorStop(1,   'rgba(30,50,18,0)');
  bgCtx.fillStyle = cg;
  bgCtx.fillRect(0,H*0.55,W,H*0.45);
}

// ============================================================
// LIGHT RAYS
// ============================================================
function drawRays(t) {
  const CX = W/2;
  const clearLeft  = CX - CLEARING_FRAC*W;
  const clearRight = CX + CLEARING_FRAC*W;
  const horizY = H*0.48;

  const rays = [
    { ox: clearLeft  - W*0.18, angle:  22, w:38 },
    { ox: clearLeft  - W*0.06, angle:  18, w:24 },
    { ox: clearLeft  - W*0.28, angle:  28, w:18 },
    { ox: clearRight + W*0.18, angle: -22, w:38 },
    { ox: clearRight + W*0.06, angle: -18, w:24 },
    { ox: clearRight + W*0.28, angle: -28, w:18 },
  ];

  rays.forEach((ray,i) => {
    const breath = 0.55 + 0.45*Math.sin(t*0.18 + i*1.1 + Math.sin(t*0.07)*0.8);
    const rad  = ray.angle * Math.PI/180;
    const len  = H*1.4, hw = ray.w/2;
    const px = Math.cos(rad+Math.PI/2), py = Math.sin(rad+Math.PI/2);
    const dx = Math.sin(rad), dy = -Math.cos(rad);
    const x0 = ray.ox, y0 = horizY;
    const x1 = x0+dx*len, y1 = y0+dy*len;

    const grd = bgCtx.createLinearGradient(x0,y0,x1,y1);
    grd.addColorStop(0,   `rgba(255,218,120,${0.11*breath})`);
    grd.addColorStop(0.3, `rgba(255,210,100,${0.06*breath})`);
    grd.addColorStop(1,   'rgba(255,200,80,0)');

    bgCtx.save();
    bgCtx.beginPath();
    bgCtx.moveTo(x0-px*hw, y0-py*hw);
    bgCtx.lineTo(x0+px*hw, y0+py*hw);
    bgCtx.lineTo(x1+px*hw*3.5, y1+py*hw*3.5);
    bgCtx.lineTo(x1-px*hw*3.5, y1-py*hw*3.5);
    bgCtx.closePath();
    bgCtx.fillStyle = grd;
    bgCtx.globalCompositeOperation = 'screen';
    bgCtx.fill();
    bgCtx.restore();
  });
}

// ============================================================
// GRASS
// ============================================================
let blades = [];

function buildGrass() {
  blades = [];
  const CX = W/2;
  const clearLeft  = CX - CLEARING_FRAC*W;
  const clearRight = CX + CLEARING_FRAC*W;

  for (let i=0; i<1000; i++) {
    const x = clearLeft + Math.random()*(clearRight-clearLeft);
    const row = Math.random();
    blades.push({
      x, groundY: H*(0.62+row*0.16),
      len: 14+Math.random()*22,
      phase: Math.random()*Math.PI*2,
      lean: (Math.random()-0.5)*0.3,
      hue: 90+Math.random()*30,
      light: 28+Math.random()*22,
      inClearing: true, rustleT: 0
    });
  }
  for (let i=0; i<700; i++) {
    const side = Math.random()<0.5;
    const x = side
      ? Math.random()*(clearLeft-10)
      : clearRight+10+Math.random()*(W-clearRight-10);
    blades.push({
      x, groundY: H*(0.6+Math.random()*0.2),
      len: 6+Math.random()*12,
      phase: Math.random()*Math.PI*2,
      lean: (Math.random()-0.5)*0.2,
      hue: 100+Math.random()*20,
      light: 14+Math.random()*12,
      inClearing: false, rustleT: 0
    });
  }
}
buildGrass();

function drawGrass(t) {
  blades.forEach(b => {
    const wind = windAt(b.x, b.phase, t);
    const sway = wind*0.14 + b.lean;
    const tipX = b.x + Math.sin(sway)*b.len;
    const tipY = b.groundY - b.len*Math.cos(Math.abs(sway)*0.3);
    if (b.rustleT > 0) b.rustleT -= 0.03;
    const boost = Math.max(0,b.rustleT)*25;
    bgCtx.strokeStyle = `hsl(${b.hue},55%,${b.light+boost}%)`;
    bgCtx.lineWidth = b.inClearing ? 1.0+Math.random()*0.3 : 0.7;
    bgCtx.lineCap = 'round';
    bgCtx.beginPath();
    bgCtx.moveTo(b.x, b.groundY);
    bgCtx.quadraticCurveTo(
      b.x+Math.sin(sway)*b.len*0.5, b.groundY-b.len*0.5,
      tipX, tipY
    );
    bgCtx.stroke();
  });
}

// ============================================================
// FOG
// ============================================================
function drawFog(t) {
  const fogY = H*0.74, fogH = H*0.12;
  for (let i=0; i<5; i++) {
    const phase = i*1.3 + t*0.04;
    const cx = (W/2 + Math.sin(phase)*W*0.25 + i*W*0.18) % W;
    const cy = fogY + Math.sin(phase*0.7)*8;
    const rx = W*(0.22+0.12*Math.sin(phase*0.4));
    const ry = fogH*(0.4+0.2*Math.sin(phase*0.5));
    const fog = bgCtx.createRadialGradient(cx,cy,0, cx,cy+ry*0.2, Math.max(rx,ry));
    fog.addColorStop(0,   'rgba(195,225,165,0.07)');
    fog.addColorStop(0.5, 'rgba(180,215,150,0.035)');
    fog.addColorStop(1,   'transparent');
    bgCtx.save();
    bgCtx.scale(1, ry/rx);
    bgCtx.beginPath();
    bgCtx.arc(cx, cy*(rx/ry), rx, 0, Math.PI*2);
    bgCtx.fillStyle = fog;
    bgCtx.fill();
    bgCtx.restore();
  }
}

// ============================================================
// CURSOR GRASS RUSTLE
// ============================================================
let mouseX=-999, mouseY=-999, lastMX=-999, lastMY=-999, lastRustleTime=0;

iCanvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  const spd = Math.hypot(mouseX-lastMX, mouseY-lastMY);
  if (spd > 3) {
    blades.forEach(b => {
      if (Math.hypot(b.x-mouseX, b.groundY-mouseY) < 55) {
        b.rustleT = 1.0;
        triggerRustle();
      }
    });
    lastMX=mouseX; lastMY=mouseY;
  }
});

// ============================================================
// THREE.JS SCENE
// ============================================================
const threeCanvas = document.getElementById('three-canvas');

const renderer = new THREE.WebGLRenderer({
  canvas: threeCanvas,
  alpha: true,
  antialias: true,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = false;
renderer.setClearColor(0x000000, 0); // transparent

const scene = new THREE.Scene();

// Camera — orthographic-ish perspective, wide FOV for flat feel
const camera = new THREE.PerspectiveCamera(42, W/H, 0.1, 2000);
camera.position.set(0, 3.5, 22);
camera.lookAt(0, 2, 0);

// Lighting — sunrise warm key from left, soft fill
const sunLight = new THREE.DirectionalLight(0xffd98a, 2.2);
sunLight.position.set(-8, 12, 6);
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xb8dfa0, 0.6);
fillLight.position.set(6, 8, 4);
scene.add(fillLight);

const ambLight = new THREE.AmbientLight(0x3a5c28, 0.8);
scene.add(ambLight);

// Wind shader injection
// We patch the material onBeforeCompile to add vertex displacement
const WIND_VERT_CHUNK = `
  // Wind sway — height-based, matches 2D canvas wind
  float windPhase = uWindTime * 1.1 + position.x * 0.3 + uWindPhase;
  float sway = sin(windPhase) * uWindStrength
             + sin(uWindTime * 0.7 + uWindPhase * 1.3) * uWindStrength * 0.4;
  // More sway at top, zero at base
  float heightFactor = clamp(transformed.y / uTreeHeight, 0.0, 1.0);
  heightFactor = heightFactor * heightFactor; // quadratic — root stays firm
  transformed.x += sway * heightFactor * 0.35;
  transformed.z += sway * heightFactor * 0.12;
`;

// Shared uniforms updated every frame
const windUniforms = {
  uWindTime:     { value: 0.0 },
  uWindStrength: { value: 0.0 },
  uWindPhase:    { value: 0.0 },
  uTreeHeight:   { value: 4.0 },
};

function patchWindMaterial(mat, phaseOffset, treeHeight) {
  const u = {
    uWindTime:     { value: 0.0 },
    uWindStrength: { value: 0.0 },
    uWindPhase:    { value: phaseOffset },
    uTreeHeight:   { value: treeHeight },
  };
  mat.onBeforeCompile = shader => {
    shader.uniforms.uWindTime     = u.uWindTime;
    shader.uniforms.uWindStrength = u.uWindStrength;
    shader.uniforms.uWindPhase    = u.uWindPhase;
    shader.uniforms.uTreeHeight   = u.uTreeHeight;
    shader.vertexShader = `
      uniform float uWindTime;
      uniform float uWindStrength;
      uniform float uWindPhase;
      uniform float uTreeHeight;
    ` + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n' + WIND_VERT_CHUNK
    );
    mat._windUniforms = u;
  };
  mat._windUniformsRef = u;
  mat.needsUpdate = true;
  return u;
}

// All wind uniform sets to update each frame
const allWindUniforms = [];

// Load GLB
let treeTemplate = null;
const loader = new THREE.GLTFLoader();

loader.load(
  'tree.glb',
  (gltf) => {
    treeTemplate = gltf.scene;
    onTreeLoaded();
  },
  (xhr) => { /* progress */ },
  (err) => { console.error('GLB load error:', err); onTreeLoaded(); }
);

function onTreeLoaded() {
  if (treeTemplate) {
    placeTrees();
  }
  // Start render loop regardless
  startRenderLoop();
  // Fade loading screen
  setTimeout(() => {
    document.getElementById('loading').classList.add('fade');
    setTimeout(() => document.getElementById('loading').remove(), 1600);
    document.getElementById('label').classList.add('visible');
    document.getElementById('next').classList.add('visible');
    document.getElementById('mute').classList.add('visible');
  }, 800);
}

function placeTrees() {
  // World coords: X spans roughly -W/2..W/2 in world units, Y=0 is ground
  // Camera is at Z=22 looking at origin, so world X maps to screen X approximately
  // Clearing in world coords: X from -4 to +4 (roughly)
  const CLEAR_X = 4.2; // half-width of clearing in world units

  // Compute world X range from screen width
  // At Z=0 and camera Z=22, FOV=42: half_width = tan(21°)*22 ≈ 8.44
  const halfW = Math.tan((42/2)*Math.PI/180) * 22;

  const positions = [];

  // Left forest
  for (let i=0; i<18; i++) {
    const wx = -halfW + Math.random()*(halfW - CLEAR_X - 0.5);
    const wz = -6 + Math.random()*10; // depth variation
    const wy = 0;
    positions.push({ wx, wy, wz, side:'left' });
  }
  // Right forest
  for (let i=0; i<18; i++) {
    const wx = CLEAR_X + 0.5 + Math.random()*(halfW - CLEAR_X - 0.5);
    const wz = -6 + Math.random()*10;
    positions.push({ wx, wy:0, wz, side:'right' });
  }
  // Background trees (behind clearing, further back)
  for (let i=0; i<6; i++) {
    const wx = -CLEAR_X*0.8 + Math.random()*CLEAR_X*1.6;
    const wz = -8 + Math.random()*(-4);
    positions.push({ wx, wy:0, wz, side:'bg' });
  }

  positions.forEach((pos, idx) => {
    const clone = treeTemplate.clone(true);

    // Randomise scale — wrong proportions, dreamlike
    const baseScale = 0.9 + Math.random()*0.8;
    const heightBias = pos.side === 'bg' ? 0.55 : (0.75 + Math.random()*0.5);
    clone.scale.set(
      baseScale * (0.85 + Math.random()*0.3),
      baseScale * heightBias,
      baseScale * (0.85 + Math.random()*0.3)
    );

    // Slight random Y rotation so trees don't all face same way
    clone.rotation.y = Math.random()*Math.PI*2;

    clone.position.set(pos.wx, pos.wy, pos.wz);

    // Patch materials with wind shader
    const phase = Math.random()*Math.PI*2;
    const treeH = 4 * baseScale * heightBias;

    clone.traverse(child => {
      if (child.isMesh) {
        // Clone material so each tree has independent uniforms
        child.material = child.material.clone();
        child.material.alphaTest = child.material.alphaMode === 'MASK' ? 0.5 : 0;

        const u = patchWindMaterial(child.material, phase, treeH);
        allWindUniforms.push(u);

        // Tint far-back trees slightly darker/more desaturated
        if (pos.side === 'bg') {
          child.material.color = child.material.color || new THREE.Color(1,1,1);
          child.material.color.multiplyScalar(0.65);
        }
      }
    });

    scene.add(clone);
  });
}

function updateWindUniforms(t) {
  const strength = windStrength + windGust;
  allWindUniforms.forEach(u => {
    u.uWindTime.value     = t;
    u.uWindStrength.value = strength;
    // uWindPhase stays per-tree
  });
}

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  resizeCanvases();
  buildGrass();
  camera.aspect = W/H;
  camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});

// ============================================================
// AUDIO
// ============================================================
let audioStarted=false, isMuted=false, masterGain, rustleEnv;

async function startAudio() {
  if (audioStarted) return;
  audioStarted = true;
  await Tone.start();

  masterGain = new Tone.Gain(0.7).toDestination();

  // Wind — pink noise breathing
  const windNoise  = new Tone.Noise('pink');
  const windFilter = new Tone.Filter(320,'bandpass');
  windFilter.Q.value = 0.6;
  const windGainNode = new Tone.Gain(0).connect(masterGain);
  windNoise.connect(windFilter); windFilter.connect(windGainNode);
  windNoise.start();
  const windLFO = new Tone.LFO({frequency:0.07, min:0, max:0.18, type:'sine'});
  windLFO.connect(windGainNode.gain); windLFO.start();

  // Birds
  function chirp() {
    if (isMuted) { setTimeout(chirp, 2000+Math.random()*6000); return; }
    const osc   = new Tone.Oscillator(1800+Math.random()*1400,'sine');
    const env   = new Tone.AmplitudeEnvelope({attack:0.04,decay:0.12,sustain:0.2,release:0.4});
    const bg    = new Tone.Gain(0.04).connect(masterGain);
    const pan   = new Tone.Panner(Math.random()*2-1).connect(bg);
    osc.connect(env); env.connect(pan);
    osc.start(); env.triggerAttackRelease(0.1+Math.random()*0.15);
    setTimeout(()=>osc.dispose(),1200);
    setTimeout(chirp, 1800+Math.random()*7000);
  }
  setTimeout(chirp, 1000+Math.random()*3000);

  // Leaf rustle
  const leafNoise  = new Tone.Noise('white');
  const leafFilter = new Tone.Filter(2800,'bandpass');
  leafFilter.Q.value = 1.8;
  rustleEnv = new Tone.AmplitudeEnvelope({attack:0.05,decay:0.3,sustain:0,release:0.4});
  const leafGain = new Tone.Gain(0.09).connect(masterGain);
  leafNoise.connect(leafFilter); leafFilter.connect(rustleEnv); rustleEnv.connect(leafGain);
  leafNoise.start();
  function ambRustle() {
    if (!isMuted) rustleEnv.triggerAttackRelease(0.18+Math.random()*0.3);
    setTimeout(ambRustle, 1200+Math.random()*4500);
  }
  setTimeout(ambRustle,2000);

  // Rumble
  const rumble = new Tone.Noise('brown');
  const rumbleF = new Tone.Filter(80,'lowpass');
  const rumbleG = new Tone.Gain(0.06).connect(masterGain);
  rumble.connect(rumbleF); rumbleF.connect(rumbleG); rumble.start();
}

let lastRustleSnd = 0;
function triggerRustle() {
  if (!audioStarted||isMuted) return;
  const now = performance.now();
  if (now-lastRustleSnd < 80) return;
  lastRustleSnd = now;
  if (rustleEnv) rustleEnv.triggerAttackRelease(0.08);
}

document.getElementById('mute').addEventListener('click', () => {
  isMuted = !isMuted;
  if (masterGain) masterGain.gain.rampTo(isMuted?0:0.7, 0.4);
  document.getElementById('wave1').style.opacity = isMuted?'0.2':'1';
  document.getElementById('wave2').style.opacity = isMuted?'0.2':'1';
});

document.addEventListener('click', startAudio, {once:true});
document.addEventListener('keydown', startAudio, {once:true});

// ============================================================
// MAIN LOOP
// ============================================================
let t=0, lastTime=null;

function startRenderLoop() {
  function frame(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;
    t += dt;

    tickWind(dt);
    updateWindUniforms(t);

    // BG canvas
    bgCtx.clearRect(0,0,W,H);
    drawSky();
    drawGround();
    drawRays(t);
    drawGrass(t);
    drawFog(t);

    // Three.js
    renderer.render(scene, camera);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Next room
document.getElementById('next').addEventListener('click', () => {
  document.body.style.transition = 'opacity 1.2s ease';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = '02.html'; }, 1200);
});
</script>
