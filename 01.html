<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 — clearing</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#1a0a2e; }

#bg-canvas { position:fixed; inset:0; z-index:0; }
#three-canvas { position:fixed; inset:0; z-index:1; pointer-events:none; }

#grain {
  position:fixed; inset:-50%; width:200%; height:200%;
  pointer-events:none; z-index:20; opacity:0.03;
  animation:grainShift 0.14s steps(1) infinite;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}
@keyframes grainShift {
  0%  { transform:translate(0,0); }   20% { transform:translate(-3%,-4%); }
  40% { transform:translate(4%,2%); } 60% { transform:translate(-2%,5%); }
  80% { transform:translate(5%,-2%); }
}

#label {
  position:fixed; top:1.8rem; left:2rem; z-index:100;
  font-family:'Georgia',serif; font-size:0.7rem; letter-spacing:0.18em;
  color:rgba(255,194,226,0.3); text-transform:uppercase;
  opacity:0; transition:opacity 2s ease; user-select:none;
}
#label.visible { opacity:1; }

#next {
  position:fixed; bottom:2rem; right:2.2rem; z-index:100;
  width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  border:none; background:none; cursor:pointer; opacity:0; transition:opacity 1.2s ease;
}
#next.visible { opacity:1; }
#next svg { width:28px; height:28px; stroke:rgba(184,146,255,0.5); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; transition:stroke .3s,transform .3s; }
#next:hover svg { stroke:rgba(255,144,179,0.9); transform:translateX(4px); }

#mute {
  position:fixed; bottom:2rem; left:2rem; z-index:100;
  background:none; border:none; cursor:pointer; opacity:0; transition:opacity 1.2s ease; padding:4px;
}
#mute.visible { opacity:1; }
#mute svg { width:20px; height:20px; stroke:rgba(184,146,255,0.4); fill:none; stroke-width:1.4; stroke-linecap:round; transition:stroke .3s; }
#mute:hover svg { stroke:rgba(255,144,179,0.8); }

#loading {
  position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  background:#1a0a2e; font-family:'Georgia',serif; font-size:0.72rem; letter-spacing:0.22em;
  color:rgba(184,146,255,0.4); text-transform:uppercase; transition:opacity 1.6s ease;
}
#loading.fade { opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div id="loading">entering</div>
<canvas id="bg-canvas"></canvas>
<canvas id="three-canvas"></canvas>
<div id="grain"></div>
<div id="label">01 — clearing</div>

<button id="mute" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path id="wave1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path id="wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </svg>
</button>
<button id="next" aria-label="Next room">
  <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<script>
// ── CANVAS SETUP ─────────────────────────────────────────────
let W = window.innerWidth, H = window.innerHeight;
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  bgCanvas.width = W; bgCanvas.height = H;
  camera.aspect = W/H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
}
bgCanvas.width = W; bgCanvas.height = H;
window.addEventListener('resize', resize);

// ── WIND ─────────────────────────────────────────────────────
let windTime=0, windStrength=0, windTarget=0, windGust=0;
function tickWind(dt) {
  windTime += dt*0.35;
  if (Math.random()<0.007) windTarget=(Math.random()-0.35)*1.1;
  windStrength += (windTarget-windStrength)*0.01;
  if (Math.random()<0.003) windGust=(Math.random()*0.6+0.2)*Math.sign(windStrength||1);
  windGust *= 0.975;
}

// ── BG CANVAS — sky + grass only ─────────────────────────────
function drawBG(t) {
  bgCtx.clearRect(0,0,W,H);

  // Sky — majorelle purple → periwinkle → blush → cotton candy → coral
  const sky = bgCtx.createLinearGradient(0,0,0,H*0.58);
  sky.addColorStop(0,   '#6e44ff'); // majorelle-blue
  sky.addColorStop(0.3, '#b892ff'); // soft-periwinkle
  sky.addColorStop(0.6, '#ffc2e2'); // blush-pop
  sky.addColorStop(0.82,'#ff90b3'); // cotton-candy
  sky.addColorStop(1,   '#ef7a85'); // light-coral
  bgCtx.fillStyle=sky;
  bgCtx.fillRect(0,0,W,H*0.58);

  // Horizon glow — warm pink bloom where sky meets ground
  const hgY = H*0.56;
  const hg = bgCtx.createRadialGradient(W/2, hgY, 0, W/2, hgY, W*0.5);
  hg.addColorStop(0,   'rgba(255,200,220,0.45)');
  hg.addColorStop(0.4, 'rgba(255,144,179,0.15)');
  hg.addColorStop(1,   'rgba(110,68,255,0)');
  bgCtx.fillStyle=hg;
  bgCtx.fillRect(0,0,W,H*0.65);

  // Grass — electric gradient from horizon to bottom
  // dark-spruce → green → bright-fern → radioactive-grass → slime-lime → chartreuse
  const grass = bgCtx.createLinearGradient(0,H*0.56,0,H);
  grass.addColorStop(0,   '#004b23'); // dark-spruce (back / far grass)
  grass.addColorStop(0.15,'#006400'); // green
  grass.addColorStop(0.35,'#008000'); // green-3
  grass.addColorStop(0.58,'#38b000'); // bright-fern
  grass.addColorStop(0.78,'#70e000'); // radioactive-grass
  grass.addColorStop(0.92,'#9ef01a'); // slime-lime
  grass.addColorStop(1,   '#ccff33'); // chartreuse (near / foreground)
  bgCtx.fillStyle=grass;
  bgCtx.fillRect(0,H*0.56,W,H*0.44);

  // Grass blade layer — animated swaying blades in foreground
  drawGrass(t);

  // Subtle vignette on left/right edges only — dark enough to frame without blocking trees
  const vL=bgCtx.createLinearGradient(0,0,W*0.18,0);
  vL.addColorStop(0,'rgba(10,2,30,0.6)'); vL.addColorStop(1,'rgba(10,2,30,0)');
  bgCtx.fillStyle=vL; bgCtx.fillRect(0,0,W*0.18,H);

  const vR=bgCtx.createLinearGradient(W,0,W*0.82,0);
  vR.addColorStop(0,'rgba(10,2,30,0.6)'); vR.addColorStop(1,'rgba(10,2,30,0)');
  bgCtx.fillStyle=vR; bgCtx.fillRect(W*0.82,0,W*0.18,H);

  // Very subtle top vignette
  const vT=bgCtx.createLinearGradient(0,0,0,H*0.12);
  vT.addColorStop(0,'rgba(8,2,24,0.55)'); vT.addColorStop(1,'rgba(8,2,24,0)');
  bgCtx.fillStyle=vT; bgCtx.fillRect(0,0,W,H*0.12);
}

// ── GRASS BLADES ──────────────────────────────────────────────
const BLADE_COUNT = 220;
const blades = [];
for(let i=0;i<BLADE_COUNT;i++){
  blades.push({
    x: Math.random(),          // 0-1 of W
    y: 0.58 + Math.random()*0.42, // vertical position (lower = more foreground)
    h: 0.018 + Math.random()*0.055, // height as fraction of H
    w: 1.2 + Math.random()*2.2,
    ph: Math.random()*Math.PI*2,
    spd: 0.7 + Math.random()*0.8,
    lean: (Math.random()-0.5)*0.18,
  });
}
// Sort back to front so foreground blades draw on top
blades.sort((a,b)=>a.y-b.y);

function drawGrass(t) {
  const w = windStrength + windGust;

  blades.forEach(b => {
    const bx = b.x * W;
    const by = b.y * H;
    const bh = b.h * H;
    const depth = (b.y - 0.58) / 0.42; // 0=far, 1=near

    // Colour: far blades are dark, near blades are electric/chartreuse
    const r1 = Math.round(0 + depth * 110);
    const g1 = Math.round(75 + depth * 155);
    const b1 = Math.round(35 + depth * 0);
    const alpha = 0.45 + depth * 0.5;

    // Sway
    const sway = (Math.sin(windTime*b.spd + b.ph)*w*0.6 + b.lean) * bh * 0.6;

    bgCtx.save();
    bgCtx.globalAlpha = alpha;
    bgCtx.strokeStyle = `rgb(${r1},${g1},${b1})`;
    bgCtx.lineWidth = b.w * (0.4 + depth*0.8);
    bgCtx.lineCap = 'round';
    bgCtx.beginPath();
    bgCtx.moveTo(bx, by);
    // Quadratic curve — tip sways, base is fixed
    bgCtx.quadraticCurveTo(
      bx + sway*0.5, by - bh*0.5,
      bx + sway,     by - bh
    );
    bgCtx.stroke();
    bgCtx.restore();
  });
}

// ── THREE.JS ─────────────────────────────────────────────────
const threeCanvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({canvas:threeCanvas, alpha:true, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0,0);

const scene = new THREE.Scene();

// Camera: moderate distance, slightly lower, looking slightly up
const camera = new THREE.PerspectiveCamera(62, W/H, 0.1, 500);
camera.position.set(0, 1.8, 26);
camera.lookAt(0, 6, 0);

// Lighting: tinted to match the purple-pink sky
scene.add(new THREE.HemisphereLight(0x9966ff, 0x004b23, 1.2));
const rim = new THREE.DirectionalLight(0xff90b3, 0.9);
rim.position.set(0, 12, -20); scene.add(rim);
const fill = new THREE.DirectionalLight(0xb892ff, 0.4);
fill.position.set(0, 4, 26); scene.add(fill);

// Wind vertex shader patch
const WIND = `
  float wp = uT*1.05 + position.x*0.25 + uPh;
  float ws = sin(wp)*uW + sin(uT*0.68+uPh*1.3)*uW*0.38;
  float hf = clamp(transformed.y/uH,0.0,1.0); hf*=hf;
  transformed.x += ws*hf*0.28;
  transformed.z += ws*hf*0.09;
`;
const allU=[];
function patchWind(mat, ph, h) {
  const u={uT:{value:0},uW:{value:0},uPh:{value:ph},uH:{value:h}};
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,u);
    sh.vertexShader=`uniform float uT,uW,uPh,uH;\n`+sh.vertexShader;
    sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n'+WIND);
  };
  mat.needsUpdate=true; allU.push(u); return u;
}
function updateWind(t){const w=windStrength+windGust; allU.forEach(u=>{u.uT.value=t;u.uW.value=w;});}

const loader = new THREE.GLTFLoader();
loader.load('tree.glb', gltf=>{
  placeTrees(gltf.scene);
  fadeIn();
}, null, err=>{ console.error(err); fadeIn(); });

function placeTrees(tmpl) {
  /*
    CAGE layout — trees surround you from sides, not just left/right tunnel.
    Camera at Z=26, FOV 62°: half-width ≈ tan(31°)*26 ≈ 15.6

    Arrangement:
    - 2 extreme foreground flankers (very close, almost off-screen left/right)
    - 2 mid foreground trees (inward from flankers)
    - 2 background trees on the sides
    - 2 deep background trees closing the centre gap
    dk = darkness/visibility. 1.0 = full material brightness, 0.1 = near black.
    We want trees visible so dk is higher than before.
  */
  const trees = [
    // ── FAR BACKGROUND — closing the gap, pushed deep ──
    { x:-4,   z:-22, sx:1.2, sy:1.5, ry: 0.8, ph:3.3, dk:0.55 },
    { x: 4,   z:-22, sx:1.1, sy:1.4, ry:-1.0, ph:1.7, dk:0.55 },

    // ── BACKGROUND SIDES ──
    { x:-13,  z:-14, sx:1.4, sy:1.8, ry: 0.4, ph:2.8, dk:0.65 },
    { x: 13,  z:-14, sx:1.3, sy:1.7, ry:-0.6, ph:0.6, dk:0.65 },

    // ── MID FOREGROUND — visible, part of the cage ──
    { x:-9,   z: 2,  sx:1.5, sy:2.0, ry: 0.5, ph:2.0, dk:0.75 },
    { x: 9,   z: 2,  sx:1.4, sy:1.9, ry:-0.7, ph:1.1, dk:0.75 },

    // ── EXTREME FOREGROUND FLANKERS — close to camera, tall, frame the sides ──
    { x:-16,  z:14,  sx:2.0, sy:2.6, ry: 0.15,ph:0.3, dk:0.82 },
    { x: 16,  z:14,  sx:1.9, sy:2.5, ry:-0.2, ph:1.9, dk:0.82 },
  ];

  trees.forEach(p=>{
    const clone=tmpl.clone(true);
    clone.scale.set(p.sx, p.sy, p.sx);
    clone.rotation.y=p.ry;
    clone.position.set(p.x, 0, p.z);
    const h=5*p.sy;
    clone.traverse(child=>{
      if(!child.isMesh) return;
      child.material=child.material.clone();
      // Apply tint toward purple-pink to blend with sky palette
      const base = child.material.color ? child.material.color.clone() : new THREE.Color(1,1,1);
      base.multiplyScalar(p.dk);
      child.material.color = base;
      if(child.material.name==='leaves'||child.material.alphaMap){
        child.material.alphaTest=0.45;
        child.material.transparent=true;
        child.material.side=THREE.DoubleSide;
      }
      patchWind(child.material, p.ph, h);
    });
    scene.add(clone);
  });
}

function fadeIn(){
  setTimeout(()=>{
    document.getElementById('loading').classList.add('fade');
    setTimeout(()=>document.getElementById('loading').remove(),1700);
    document.getElementById('label').classList.add('visible');
    document.getElementById('next').classList.add('visible');
    document.getElementById('mute').classList.add('visible');
  },500);
}

// ── AUDIO ─────────────────────────────────────────────────────
let audioOn=false,isMuted=false,masterGain,rustleEnv;
async function startAudio(){
  if(audioOn)return; audioOn=true; await Tone.start();
  masterGain=new Tone.Gain(0.65).toDestination();
  const wn=new Tone.Noise('pink'),wf=new Tone.Filter(300,'bandpass');
  wf.Q.value=0.5;
  const wg=new Tone.Gain(0).connect(masterGain);
  wn.connect(wf);wf.connect(wg);wn.start();
  new Tone.LFO({frequency:0.06,min:0,max:0.16}).connect(wg.gain).start();
  (function chirp(){
    if(isMuted){setTimeout(chirp,3000+Math.random()*8000);return;}
    const o=new Tone.Oscillator(1600+Math.random()*1800,'sine');
    const e=new Tone.AmplitudeEnvelope({attack:0.04,decay:0.14,sustain:0.18,release:0.5});
    const g=new Tone.Gain(0.035).connect(masterGain);
    const p=new Tone.Panner(Math.random()*2-1).connect(g);
    o.connect(e);e.connect(p);o.start();e.triggerAttackRelease(0.08+Math.random()*0.18);
    setTimeout(()=>o.dispose(),1500);
    setTimeout(chirp,2500+Math.random()*9000);
  })();
  const ln=new Tone.Noise('white'),lf=new Tone.Filter(3200,'bandpass');
  lf.Q.value=2.2;
  rustleEnv=new Tone.AmplitudeEnvelope({attack:0.04,decay:0.28,sustain:0,release:0.5});
  const lg=new Tone.Gain(0.08).connect(masterGain);
  ln.connect(lf);lf.connect(rustleEnv);rustleEnv.connect(lg);ln.start();
  (function ar(){
    if(!isMuted)rustleEnv.triggerAttackRelease(0.15+Math.random()*0.35);
    setTimeout(ar,1500+Math.random()*5000);
  })();
  const rn=new Tone.Noise('brown'),rf=new Tone.Filter(70,'lowpass');
  const rg=new Tone.Gain(0.055).connect(masterGain);
  rn.connect(rf);rf.connect(rg);rn.start();
}
document.getElementById('mute').addEventListener('click',()=>{
  isMuted=!isMuted;
  if(masterGain)masterGain.gain.rampTo(isMuted?0:0.65,0.4);
  document.getElementById('wave1').style.opacity=isMuted?'0.15':'1';
  document.getElementById('wave2').style.opacity=isMuted?'0.15':'1';
});
document.addEventListener('click',startAudio,{once:true});
document.addEventListener('keydown',startAudio,{once:true});

// ── LOOP ──────────────────────────────────────────────────────
let t=0,lastT=null;
(function frame(now){
  if(!lastT)lastT=now;
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now; t+=dt;
  tickWind(dt);
  updateWind(t);
  drawBG(t);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
})(performance.now());

document.getElementById('next').addEventListener('click',()=>{
  document.body.style.transition='opacity 1.2s ease';
  document.body.style.opacity='0';
  setTimeout(()=>{window.location.href='02.html';},1200);
});
</script>
</body>
</html>
